name: Publish container and Helm chart

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      chart: ${{ steps.release.outputs.chart }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - name: Check release versions and reviewed source
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${RELEASE_TAG#v}"
          CHART_VERSION="$(helm show chart charts/tuber | awk '/^version:/ {print $2}')"
          APP_VERSION="$(helm show chart charts/tuber | awk '/^appVersion:/ {gsub(/"/, "", $2); print $2}')"
          test "$VERSION" = "$CHART_VERSION"
          test "$VERSION" = "$APP_VERSION"
          git merge-base --is-ancestor HEAD origin/main
          BASE_IMAGE="$(awk '/image: ghcr.io/ {print $2; exit}' deploy/kustomize/base/deployment.yaml)"
          test "$BASE_IMAGE" = "ghcr.io/${GITHUB_REPOSITORY,,}:v${VERSION}" || {
            echo "Kustomize base image ($BASE_IMAGE) must be ghcr.io/${GITHUB_REPOSITORY,,}:v${VERSION}" >&2
            exit 1
          }
          CHART_IMAGE="$(awk '/^image:/ {i=1; next} i && /^  repository:/ {print $2; exit}' charts/tuber/values.yaml)"
          test "$CHART_IMAGE" = "ghcr.io/${GITHUB_REPOSITORY,,}" || {
            echo "values.yaml image.repository ($CHART_IMAGE) must equal ghcr.io/${GITHUB_REPOSITORY,,}" >&2
            exit 1
          }
          printf 'version=%s\nimage=%s\nchart=%s\n' \
            "$VERSION" "ghcr.io/${GITHUB_REPOSITORY,,}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/tuber" >> "$GITHUB_OUTPUT"
      - name: Validate before publishing
        run: |
          helm lint charts/tuber -f charts/tuber/examples/gke.yaml --strict
          helm lint charts/tuber -f charts/tuber/examples/eks.yaml --strict
          go test -count=1 ./...
          go vet ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart and refuse to overwrite a published image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.release.outputs.image }}:v${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/tuber --destination dist
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "$IMAGE_REF already exists; published tags are immutable. Use a new version." >&2
            exit 1
          fi
      - name: Publish versioned amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}:v${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish OCI chart
        run: |
          set -euo pipefail
          helm push dist/tuber-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  verify-public:
    needs: publish
    runs-on: ubuntu-latest
    # Separate runner: no registry login, so private packages fail this check.
    steps:
      - uses: azure/setup-helm@v5
        with:
          version: v3.18.4
      - uses: docker/setup-buildx-action@v4
      - name: Verify anonymous chart and multi-platform image access
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          CHART: ${{ needs.publish.outputs.chart }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          helm pull "oci://$CHART" --version "$VERSION" --destination /tmp
          docker buildx imagetools inspect "$IMAGE:v$VERSION" --raw > /tmp/manifest.json
          python3 - <<'PY'
          import json
          with open('/tmp/manifest.json') as source:
              manifest = json.load(source)
          platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in manifest['manifests']
          }
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
          echo "Public chart and amd64/arm64 images verified for $VERSION" >> "$GITHUB_STEP_SUMMARY"
