{{- if and .Values.rbac.create .Values.cluster.detectID }}
{{- $releaseID := printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 }}
{{- $roleName := printf "%s-%s-cluster-id" (include "tuber.fullname" . | trunc 44 | trimSuffix "-") $releaseID }}
# Opt-in (cluster.detectID): read only the kube-system namespace, whose UID
# serves as the cluster ID. No other cluster-scoped access is granted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "tuber.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "tuber.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tuber.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
