{{- if .Values.rbac.create }}
{{- $root := . }}
{{- $releaseID := printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12 }}
{{- $roleName := printf "%s-%s-watch" (include "tuber.fullname" . | trunc 44 | trimSuffix "-") $releaseID }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ . }}
  labels:
    {{- include "tuber.labels" $root | nindent 4 }}
# tuber always starts Pod, Deployment, and Job informers and waits for all of
# them to sync, so this access is fixed regardless of the configured `rules`.
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ . }}
  labels:
    {{- include "tuber.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tuber.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tuber.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuber.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tuber.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tuber.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tuber.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "tuber.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
