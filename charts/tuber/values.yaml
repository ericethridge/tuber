# Cluster identity shown in annotations: name and provider are required, region is optional.
cluster:
  name: ""
  # Lowercase label, up to 63 characters. Known values: gcp-gke, aws-eks,
  # azure-aks, self-hosted, other. Any other lowercase name is accepted.
  provider: ""
  region: ""
  # Optional fixed cluster ID for {{.ClusterID}}; overrides the detected ID.
  id: ""
  # Read the kube-system namespace UID as the cluster ID. Adds a ClusterRole
  # allowing only `get` on the kube-system namespace (needs rbac.create).
  detectID: false
  # How often to recheck the Kubernetes version and distribution. "0" disables
  # rechecks; otherwise at least 1m.
  detectInterval: 1h
  # Extra distribution rules checked before the built-ins; first match wins.
  # `match` is a regex on the API server gitVersion; at most 20 rules.
  #   - match: "\\+my-distro"
  #     name: my-distro
  distributions: []

# Explicit namespaces, which must already exist. No wildcards.
watchNamespaces:
  - default

# Existing Secret in the Helm release namespace. Never put tokens in values.
credentials:
  existingSecret: ""
  tokenKey: service-account-token
  tenantIdKey: tenant-id # optional Secret key; use "" to omit the env reference

image:
  repository: ghcr.io/ericethridge/tuber
  tag: "" # defaults to v<Chart.appVersion>
  digest: "" # when set, replaces the tag
  pullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
rbac:
  create: true

dryRun: false
doit:
  baseURL: https://api.doit.com
  validateOnStartup: true
  rejectUserTokens: true
  defaultReports: []
  defaultLabels: []
  contentTemplate: "[{{.CloudProvider}}/{{.ClusterName}}] {{.Namespace}}/{{.Kind}}/{{.Name}} {{.Action}}: {{.Summary}}"
  rateLimitRPS: 10
  rateLimitBurst: 20
  timeout: 15s
  maxRetries: 3
rollup:
  ignoreOwnedPods: true
  trackOOMKilled: true
  dedupTTL: 5m
  resyncPeriod: 0s
  workers: 2
# Empty uses tuber's standard Deployment, Job, and Pod rules.
rules: []

# Informer caches grow with the Pods, Deployments, and Jobs in watched namespaces;
# raise the memory limit for namespaces with thousands of Pods.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
nodeSelector: {}
tolerations: []
