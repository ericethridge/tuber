apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuber
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tuber
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tuber
    spec:
      serviceAccountName: tuber
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tuber
          image: ghcr.io/ericethridge/tuber:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config=/etc/tuber/config.yaml"
            - "--health-addr=:8080"
            - "--leader-elect=true"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DOIT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: tuber-doit-credentials
                  key: tenant-id
                  optional: true
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/tuber
              readOnly: true
            - name: doit-credentials
              mountPath: /var/run/secrets/doit
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tuber-config
        - name: doit-credentials
          secret:
            secretName: tuber-doit-credentials
