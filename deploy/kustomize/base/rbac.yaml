apiVersion: v1
kind: ServiceAccount
metadata:
  name: tuber
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tuber-workload-watcher
  labels:
    app.kubernetes.io/name: tuber
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tuber-workload-watcher
  labels:
    app.kubernetes.io/name: tuber
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tuber-workload-watcher
subjects:
  - kind: ServiceAccount
    name: tuber
    namespace: tuber-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tuber-leader-election
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tuber-leader-election
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tuber-leader-election
subjects:
  - kind: ServiceAccount
    name: tuber
    namespace: tuber-system
