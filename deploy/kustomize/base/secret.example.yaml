apiVersion: v1
kind: Secret
metadata:
  name: tuber-doit-credentials
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
type: Opaque
stringData:
  # DoiT API token belonging to a user or service account with Cloud Analytics Admin permission.
  api-token: "REPLACE_WITH_DOIT_API_TOKEN"
  # Optional tenant ID if using a multi-tenant service account token.
  tenant-id: ""
