apiVersion: v1
kind: Secret
metadata:
  name: tuber-doit-credentials
  namespace: tuber-system
  labels:
    app.kubernetes.io/name: tuber
type: Opaque
stringData:
  # DoiT Service Account API token (NOT a legacy individual user token).
  # Create in DoiT Console -> Gear icon -> Users and access -> Service Accounts -> Select Service Account -> Create API token.
  # The Service Account must have the "Cloud Analytics Admin" permission.
  service-account-token: "REPLACE_WITH_DOIT_SERVICE_ACCOUNT_API_TOKEN"
  # Optional customer tenant ID (sent via X-Tenant-Id header) if the Service Account can access multiple tenants.
  tenant-id: ""
