# Optional ExternalSecrets Operator manifest syncing DoiT API credentials from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tuber-doit-credentials
  namespace: tuber-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: tuber-doit-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: prod/doit/annotations
        property: api_token
    - secretKey: tenant-id
      remoteRef:
        key: prod/doit/annotations
        property: tenant_id
