# Optional ExternalSecrets Operator manifest syncing DoiT API credentials from GCP Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tuber-doit-credentials
  namespace: tuber-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: tuber-doit-credentials
    creationPolicy: Owner
  data:
    - secretKey: service-account-token
      remoteRef:
        key: doit-service-account-api-token
    - secretKey: tenant-id
      remoteRef:
        key: doit-tenant-id
