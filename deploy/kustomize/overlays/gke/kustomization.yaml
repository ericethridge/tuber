apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: patch-config.yaml
  - path: patch-serviceaccount.yaml

images:
  - name: ghcr.io/ericethridge/tuber
    newName: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/tuber/tuber  # sample: replace with your registry
    newTag: v0.1.0
